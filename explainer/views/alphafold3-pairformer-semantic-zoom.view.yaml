      - { id: rpe_token_index, ref: value_sites.token_index, label: token index, prominence: context, treatment: chip, density: micro, col: 1, row: 4 }
      - { id: rpe_sym_id, ref: value_sites.sym_id, label: chain copy id, prominence: context, treatment: chip, density: micro, col: 1, row: 5 }
      - { id: rpe_module, ref: modules.relative_position_encoding, label: build pair offsets, prominence: primary, treatment: compact, density: compact, col: 2, row: 3 }
      - { id: rpe_residue_offset, ref: value_sites.relative_residue_offset, label: residue offset, prominence: secondary, treatment: compact, density: compact, col: 3, row: 1 }
      - { id: rpe_token_offset, ref: value_sites.relative_token_offset, label: token offset, prominence: secondary, treatment: compact, density: compact, col: 3, row: 2 }
      - { id: rpe_same_entity, ref: value_sites.same_entity_signal, label: same entity, prominence: secondary, treatment: compact, density: compact, col: 3, row: 4 }
      - { id: rpe_chain_offset, ref: value_sites.relative_chain_offset, label: chain-copy offset, prominence: secondary, treatment: compact, density: compact, col: 3, row: 5 }
