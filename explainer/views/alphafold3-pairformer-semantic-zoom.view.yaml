  - id: atom_attention_decoder_detail
    title: Atom Attention Decoder
    summary: The token update is broadcast back to atoms and added to the saved query skip. The two AtomTransformer boxes open different internals of one three-block call, which reads the saved conditioning and pair skip tensors; its combined result is projected to a position update.
    parent: diffusion_module_detail
    subject_ref: modules.atom_attention_decoder
    expansion_depth: 1
    grid: { columns: 5, rows: 6, column_sizing: content, col_gap: 26, row_gap: 22 }
    nodes:
      - { id: dec_token_input, ref: value_sites.diffusion_token_activation_normalized, label: refined tokens, prominence: context, treatment: compact, density: compact, col: 1, row: 1 }
      - { id: dec_query_skip, ref: value_sites.atom_attention_encoder_query_skip, label: query skip, prominence: context, treatment: chip, density: micro, col: 1, row: 2 }
      - { id: dec_conditioning_skip, ref: value_sites.atom_attention_encoder_single_conditioning_skip, label: conditioning skip, prominence: context, treatment: chip, density: micro, col: 1, row: 4 }
      - { id: dec_pair_skip, ref: value_sites.atom_attention_encoder_pair_skip, label: pair skip, prominence: context, treatment: chip, density: micro, col: 1, row: 5 }
      - { id: dec_local_mask, ref: value_sites.sequence_local_atom_attention_mask, label: local attention mask, prominence: context, treatment: chip, density: micro, col: 1, row: 6 }
      - { id: dec_module, ref: modules.atom_attention_decoder, label: broadcast token update, prominence: primary, treatment: compact, density: compact, col: 2, row: 2 }
      - { id: dec_query_with_skip, ref: value_sites.atom_query_broadcast_with_skip, label: token plus query skip, prominence: secondary, treatment: compact, density: compact, col: 3, row: 2 }
      - { id: dec_attention_branch, ref: modules.atom_decoder_atom_transformer, label: local attention branch, prominence: primary, treatment: compact, density: compact, col: 4, row: 2, board_ref: atom_decoder_attention_pair_bias_internals }
      - { id: dec_transition_branch, ref: modules.atom_decoder_atom_transformer, label: conditioned transition branch, prominence: primary, treatment: compact, density: compact, col: 4, row: 4, board_ref: atom_decoder_conditioned_transition_internals }
      - { id: dec_attended_query, ref: value_sites.atom_query_after_decoder_transformer, label: reconciled atom query, prominence: secondary, treatment: compact, density: compact, col: 5, row: 2 }
      - { id: dec_position_update, ref: value_sites.atom_attention_decoder_position_update, label: position update, prominence: secondary, treatment: compact, density: compact, col: 5, row: 4 }
    occurrence_bindings:
      - { match: { relation_ref: relations.atom_query_enters_decoder_atom_transformer }, from_occurrence: dec_query_with_skip, to_occurrence: dec_attention_branch }
      - { match: { relation_ref: relations.conditioning_skip_drives_decoder_atom_transformer }, from_occurrence: dec_conditioning_skip, to_occurrence: dec_transition_branch }
      - { match: { relation_ref: relations.pair_skip_biases_decoder_atom_transformer }, from_occurrence: dec_pair_skip, to_occurrence: dec_attention_branch }
