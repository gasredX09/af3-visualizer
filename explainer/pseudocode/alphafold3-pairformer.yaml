lines:
  - id: seed_pair_recycle
    text: "z_seed = z_init + ProjectPairRecycle(prev_pair)"
    comment: At each pass, restart from the fixed pair anchor and add a normalized projection of the previous pass; prev_pair is zero for the first pass.
    scope_ref: scopes.pairformer
    statement_ref: modules.pair_recycle_projection
    operation: seed_pair_state_for_recycle
    inputs: [fixed_pair_anchor, previous_pair]
    outputs: [pair_seed]
    architecture_refs: [execution.loops.trunk_recycling, relations.pair_anchor_initializes_recycle_pass, relations.pair_recycle_projection_updates_seed]
    source_refs: [{ source: model_code, locator: "model.py:289-319" }, { source: evoformer_code, locator: "Evoformer.__call__ prev_embedding" }]
    code_bindings:
      - { lexeme: z_seed, symbol_ref: pair_seed, access: write }
      - { lexeme: z_init, symbol_ref: fixed_pair_anchor, access: read }
      - { lexeme: ProjectPairRecycle, architecture_ref: modules.pair_recycle_projection, access: call }
      - { lexeme: prev_pair, symbol_ref: previous_pair, access: read }
  - id: run_template_per_recycle
    text: "z_template = TemplateEmbedder(z_seed, template_features)"
    scope_ref: scopes.pairformer
    statement_ref: modules.template_module
    operation: add_template_pair_evidence_each_recycle
    inputs: [pair_seed]
    outputs: [pair_after_template]
    architecture_refs: [execution.loops.trunk_recycling]
    source_refs: [{ source: evoformer_code, locator: "Evoformer.__call__ _embed_template_pair" }]
    code_bindings:
      - { lexeme: z_template, symbol_ref: pair_after_template, access: write }
      - { lexeme: TemplateEmbedder, architecture_ref: modules.template_module, access: call }
      - { lexeme: z_seed, symbol_ref: pair_seed, access: read }
  - id: run_msa_per_recycle
    text: "z = MsaModule(z_template, s_inputs, msa_features)"
    comment: MSA rows are processed anew within each trunk pass; only the pair state continues into the Pairformer.
    scope_ref: scopes.pairformer
    statement_ref: modules.msa_module
    operation: add_msa_pair_evidence_each_recycle
    inputs: [pair_after_template, raw_input_embedding]
    outputs: [input_pair]
    architecture_refs: [execution.loops.trunk_recycling]
    source_refs: [{ source: evoformer_code, locator: "Evoformer.__call__ _embed_process_msa" }]
    code_bindings:
      - { lexeme: z, symbol_ref: input_pair, access: write }
      - { lexeme: MsaModule, architecture_ref: modules.msa_module, access: call }
      - { lexeme: z_template, symbol_ref: pair_after_template, access: read }
      - { lexeme: s_inputs, symbol_ref: raw_input_embedding, access: read }
  - id: seed_single_recycle
    text: "s = s_init + ProjectSingleRecycle(prev_single)"
    comment: The single state also restarts from its fixed input-derived anchor on each pass.
    scope_ref: scopes.pairformer
    statement_ref: modules.single_recycle_projection
    operation: seed_single_state_for_recycle
    inputs: [fixed_single_anchor, previous_single]
    outputs: [input_single]
    architecture_refs: [execution.loops.trunk_recycling, relations.single_anchor_initializes_recycle_pass, relations.single_recycle_projection_updates_input]
    source_refs: [{ source: evoformer_code, locator: "Evoformer.__call__ prev_single_embedding" }]
    code_bindings:
      - { lexeme: s, symbol_ref: input_single, access: write }
      - { lexeme: s_init, symbol_ref: fixed_single_anchor, access: read }
      - { lexeme: ProjectSingleRecycle, architecture_ref: modules.single_recycle_projection, access: call }
      - { lexeme: prev_single, symbol_ref: previous_single, access: read }
  - id: run_pairformer
    text: "s_trunk, z_trunk = PairformerStack(s, z, token_mask, pair_mask)"
    comment: The same 48-block stack runs after Template and MSA in every trunk pass.
    scope_ref: scopes.pairformer
    statement_ref: modules.pairformer_stack
    callee_scope_ref: scopes.stack
    operation: run_pairformer_stack
    inputs: [input_single, input_pair, input_token_mask, input_pair_mask]
    outputs: [output_single, output_pair]
    architecture_refs:
      - claims.pairformer_has_no_msa_state
    source_refs:
      - source: evoformer_code
        locator: pairformer_stack application
    code_bindings:
      - lexeme: s_trunk
        symbol_ref: output_single
        access: write
      - lexeme: z_trunk
        symbol_ref: output_pair
        access: write
      - lexeme: PairformerStack
        architecture_ref: modules.pairformer_stack
        access: call
      - lexeme: s
        symbol_ref: input_single
        access: read
      - lexeme: z
        symbol_ref: input_pair
        access: read
      - lexeme: token_mask
        symbol_ref: input_token_mask
        access: read
      - lexeme: pair_mask
        symbol_ref: input_pair_mask
        access: read
  - id: carry_trunk_single
    text: "prev_single = s_trunk"
    scope_ref: scopes.pairformer
    statement_ref: relations.trunk_single_output_reenters_recycle
    operation: carry_single_to_next_recycle
    inputs: [output_single]
    outputs: [previous_single]
    architecture_refs: [execution.loops.trunk_recycling]
    source_refs: [{ source: model_code, locator: "model.py:289-319 recycle_body" }]
    code_bindings:
      - { lexeme: prev_single, symbol_ref: previous_single, access: write }
      - { lexeme: s_trunk, symbol_ref: output_single, access: read }
  - id: carry_trunk_pair
    text: "prev_pair = z_trunk"
    scope_ref: scopes.pairformer
    statement_ref: relations.trunk_pair_output_reenters_recycle
    operation: carry_pair_to_next_recycle
    inputs: [output_pair]
    outputs: [previous_pair]
    architecture_refs: [execution.loops.trunk_recycling]
    source_refs: [{ source: model_code, locator: "model.py:289-319 recycle_body" }]
    code_bindings:
      - { lexeme: prev_pair, symbol_ref: previous_pair, access: write }
      - { lexeme: z_trunk, symbol_ref: output_pair, access: read }
  - id: run_diffusion_after_trunk
    text: "x_sample = SampleDiffusion(s_inputs, s_trunk, z_trunk)"
    comment: Sampling begins only after the final trunk pass; the trunk outputs remain fixed for all 200 denoising calls.
    scope_ref: scopes.pairformer
    statement_ref: modules.sample_diffusion
    callee_scope_ref: scopes.sampler
    operation: sample_atoms_after_trunk_recycling
    inputs: [raw_input_embedding, output_single, output_pair]
    outputs: [final_sample]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: model_code, locator: "model.py:321-325" }, { source: sampler_code, locator: "sample" }]
    code_bindings:
      - { lexeme: x_sample, symbol_ref: final_sample, access: write }
      - { lexeme: SampleDiffusion, architecture_ref: modules.sample_diffusion, access: call }
      - { lexeme: s_inputs, symbol_ref: raw_input_embedding, access: read }
      - { lexeme: s_trunk, symbol_ref: output_single, access: read }
      - { lexeme: z_trunk, symbol_ref: output_pair, access: read }
  - id: initialize_sampler
    text: "x_initial, t_previous = InitializeGaussianSampler()"
    comment: Draw each initial atom cloud independently and scale it by the first scheduled noise level.
    scope_ref: scopes.sampler
    statement_ref: modules.sampler_coordinate_initializer
    operation: initialize_gaussian_coordinate_state
    inputs: []
    outputs: [sampler_initial, sampler_previous_noise]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:358-365" }]
    code_bindings:
      - { lexeme: x_initial, symbol_ref: sampler_initial, access: write }
      - { lexeme: t_previous, symbol_ref: sampler_previous_noise, access: write }
      - { lexeme: InitializeGaussianSampler, architecture_ref: modules.sampler_coordinate_initializer, access: call }
  - id: begin_sampler_state
    text: "x_current = x_initial"
    scope_ref: scopes.sampler
    statement_ref: relations.sampler_initial_positions_begin_state
    operation: begin_sampler_coordinate_carry
    inputs: [sampler_initial]
    outputs: [sampler_current]
    architecture_refs: []
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:365-373" }]
    code_bindings:
      - { lexeme: x_current, symbol_ref: sampler_current, access: write }
      - { lexeme: x_initial, symbol_ref: sampler_initial, access: read }
  - id: select_sampler_level
    text: "t_next, t_hat = SelectScheduleLevels(t_previous)"
    comment: The next power-seven level gates churn; t_hat is the previous level multiplied by 1 + gamma.
    scope_ref: scopes.sampler
    statement_ref: modules.sampler_schedule
    operation: select_noise_level_and_churn
    inputs: [sampler_previous_noise]
    outputs: [sampler_next_noise, sampler_t_hat]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:88-92,339-345,358-373" }]
    code_bindings:
      - { lexeme: t_next, symbol_ref: sampler_next_noise, access: write }
      - { lexeme: t_hat, symbol_ref: sampler_t_hat, access: write }
      - { lexeme: SelectScheduleLevels, architecture_ref: modules.sampler_schedule, access: call }
      - { lexeme: t_previous, symbol_ref: sampler_previous_noise, access: read }
  - id: augment_sampler_pose
    text: "x_augmented = RandomPose(x_current)"
    scope_ref: scopes.sampler
    statement_ref: modules.sampler_pose_augmentation
    operation: randomly_rotate_and_translate_current_cloud
    inputs: [sampler_current]
    outputs: [sampler_augmented]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:333-339" }]
    code_bindings:
      - { lexeme: x_augmented, symbol_ref: sampler_augmented, access: write }
      - { lexeme: RandomPose, architecture_ref: modules.sampler_pose_augmentation, access: call }
      - { lexeme: x_current, symbol_ref: sampler_current, access: read }
  - id: inject_sampler_noise
    text: "x_noisy = AddChurnNoise(x_augmented, t_previous, t_hat)"
    comment: Noise scale is 1.003 times the square root of t_hat squared minus t_previous squared.
    scope_ref: scopes.sampler
    statement_ref: modules.sampler_noise_injection
    operation: inject_churn_gaussian_noise
    inputs: [sampler_augmented, sampler_previous_noise, sampler_t_hat]
    outputs: [sampler_noisy]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:344-349" }]
    code_bindings:
      - { lexeme: x_noisy, symbol_ref: sampler_noisy, access: write }
      - { lexeme: AddChurnNoise, architecture_ref: modules.sampler_noise_injection, access: call }
      - { lexeme: x_augmented, symbol_ref: sampler_augmented, access: read }
      - { lexeme: t_previous, symbol_ref: sampler_previous_noise, access: read }
      - { lexeme: t_hat, symbol_ref: sampler_t_hat, access: read }
  - id: run_one_denoiser_call
    text: "x_estimate = DiffusionModule(x_noisy, t_hat)"
    comment: This is a clean-coordinate estimate for one step, not the sampler's next state.
    scope_ref: scopes.sampler
    statement_ref: modules.diffusion_module
    operation: estimate_denoised_atom_positions
    inputs: [sampler_noisy, sampler_t_hat]
    outputs: [sampler_estimate]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:349" }]
    code_bindings:
      - { lexeme: x_estimate, symbol_ref: sampler_estimate, access: write }
      - { lexeme: DiffusionModule, architecture_ref: modules.diffusion_module, access: call }
      - { lexeme: x_noisy, symbol_ref: sampler_noisy, access: read }
      - { lexeme: t_hat, symbol_ref: sampler_t_hat, access: read }
  - id: compute_sampler_direction
    text: "direction = (x_noisy - x_estimate) / t_hat"
    scope_ref: scopes.sampler_update_math
    statement_ref: modules.sampler_gradient
    operation: compute_denoising_direction
    inputs: [sampler_noisy, sampler_estimate, sampler_t_hat]
    outputs: [sampler_direction_symbol]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:349-350" }]
    code_bindings:
      - { lexeme: direction, symbol_ref: sampler_direction_symbol, access: write }
      - { lexeme: x_noisy, symbol_ref: sampler_noisy, access: read }
      - { lexeme: x_estimate, symbol_ref: sampler_estimate, access: read }
      - { lexeme: t_hat, symbol_ref: sampler_t_hat, access: read }
  - id: run_fixed_sampler_update
    text: "x_next = FixedSamplerUpdate(x_noisy, x_estimate, t_hat, t_next)"
    scope_ref: scopes.sampler
    statement_ref: modules.sampler_update
    callee_scope_ref: scopes.sampler_update_math
    operation: apply_fixed_sampler_update
    inputs: [sampler_noisy, sampler_estimate, sampler_t_hat, sampler_next_noise]
    outputs: [sampler_updated]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:349-354" }]
    code_bindings:
      - { lexeme: x_next, symbol_ref: sampler_updated, access: write }
      - { lexeme: FixedSamplerUpdate, architecture_ref: modules.sampler_update, access: call }
      - { lexeme: x_noisy, symbol_ref: sampler_noisy, access: read }
      - { lexeme: x_estimate, symbol_ref: sampler_estimate, access: read }
      - { lexeme: t_hat, symbol_ref: sampler_t_hat, access: read }
      - { lexeme: t_next, symbol_ref: sampler_next_noise, access: read }
  - id: apply_sampler_update
    text: "x_next = x_noisy + 1.5 * (t_next - t_hat) * direction"
    comment: The signed level difference is negative, so this step moves toward the denoiser estimate.
    scope_ref: scopes.sampler_update_math
    statement_ref: modules.sampler_update
    operation: advance_sampler_coordinates
    inputs: [sampler_noisy, sampler_next_noise, sampler_t_hat, sampler_direction_symbol]
    outputs: [sampler_updated]
    architecture_refs: [execution.loops.sample_diffusion]
    source_refs: [{ source: sampler_code, locator: "diffusion_head.py:350-354" }]
    code_bindings:
      - { lexeme: x_next, symbol_ref: sampler_updated, access: write }
      - { lexeme: x_noisy, symbol_ref: sampler_noisy, access: read }
      - { lexeme: t_next, symbol_ref: sampler_next_noise, access: read }
      - { lexeme: t_hat, symbol_ref: sampler_t_hat, access: read }
      - { lexeme: direction, symbol_ref: sampler_direction_symbol, access: read }
