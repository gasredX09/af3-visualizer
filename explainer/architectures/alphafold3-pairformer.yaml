modules:
  - id: trunk_model
    parent_ref: architecture
    decomposition: { status: complete }
    label: Recycling Trunk
    kind: refiner
    mechanisms: [input_projection, iterative_refinement]
    role: project s_inputs into fixed single and pair anchors, then run four paper-setting passes that add projected previous states and apply Template, MSA, and the 48-block Pairformer before handing final single and pair states to diffusion and confidence prediction
    scale: token_and_token_pair
    evidence:
      status: confirmed_from_paper
      refs:
        - { source_ref: af3_2024, role: paper_evidence, locator: "Supplementary Algorithm 1 lines 2-11 (fixed input projections, recycled single and pair states, Template and MSA updates, Pairformer stack, final trunk outputs)" }
  - id: pairformer_stack
    parent_ref: modules.trunk_model
    decomposition:
      status: complete
    label: Pairformer Stack
    kind: refiner
    mechanisms: [pair_reasoning, pair_biased_single_attention]
    role: refine pair and single token representations through 48 independently parameterized blocks
    scale: token_and_token_pair
    repeats: 48
    depth:
      blocks: 48
    pseudocode_ref: pseudocode/alphafold3-pairformer.yaml
    evidence:
      status: confirmed_from_code
      refs:
        - source_ref: af3_evoformer_code
          role: implementation_evidence
          locator: pairformer_stack construction and application
  - id: pair_update_stage
    parent_ref: modules.pairformer_stack
    decomposition:
      status: complete
    label: Pair Track Update
    kind: refiner
    mechanisms: [triangle_multiplication, axial_pair_attention, transition]
    role: apply five ordered residual updates to the pair representation
    scale: token_pair
    evidence: *pair_code_evidence
  - id: triangle_multiplication_outgoing
    parent_ref: modules.pair_update_stage
    decomposition:
      status: leaf
    label: Triangle Multiplication Outgoing
    kind: operator
    mechanisms: [triangle_multiplication, gated_projection, residual_update]
    role: aggregate products over shared outgoing edges and add the result to pair state
    scale: token_pair
    evidence: &triangle_code_evidence
      status: confirmed_from_code
      refs:
        - source_ref: af3_pairformer_code
          role: implementation_evidence
          locator: TriangleMultiplication.__call__ and PairFormerIteration.__call__
  - id: triangle_multiplication_incoming
    parent_ref: modules.pair_update_stage
    decomposition:
      status: leaf
    label: Triangle Multiplication Incoming
    kind: operator
    mechanisms: [triangle_multiplication, gated_projection, residual_update]
    role: aggregate products over shared incoming edges and add the result to pair state
    scale: token_pair
    evidence: *triangle_code_evidence
  - id: pair_attention_starting_node
    parent_ref: modules.pair_update_stage
    decomposition:
      status: leaf
    label: Triangle Attention Starting Node
    kind: attention
    mechanisms: [axial_attention, self_derived_pair_bias, query_gating, residual_update]
    role: update each ordered pair by attending along the starting-node pair-grid axis
    scale: token_pair
    attention:
      pattern: pair_grid_starting_node
      query_scale: token_pair
      key_value_scale: token_pair
      heads: 4
      pair_bias: true
      pair_bias_source: normalized_pair_state
      positional_encoding:
        kind: none
    evidence: &grid_attention_evidence
      status: confirmed_from_code
      refs:
        - source_ref: af3_pairformer_code
          role: implementation_evidence
          locator: GridSelfAttention.__call__, GridSelfAttention._attention, and PairFormerIteration.__call__
  - id: pair_attention_ending_node
    parent_ref: modules.pair_update_stage
    decomposition:
      status: leaf
    label: Triangle Attention Ending Node
    kind: attention
    mechanisms: [axial_attention, self_derived_pair_bias, query_gating, residual_update]
    role: transpose the pair grid, attend along the complementary ending-node axis, and add the result to pair state
    scale: token_pair
    attention:
      pattern: pair_grid_ending_node
      query_scale: token_pair
      key_value_scale: token_pair
      heads: 4
      pair_bias: true
      pair_bias_source: normalized_pair_state
      positional_encoding:
        kind: none
    evidence: *grid_attention_evidence
  - id: pair_transition
    parent_ref: modules.pair_update_stage
    decomposition:
      status: leaf
    label: Pair Transition
    kind: feed_forward
    mechanisms: [layer_normalization, swiglu, residual_update]
    role: apply a pointwise 4x SwiGLU transition and add its 128-channel projection back to each pair entry
    scale: token_pair
    evidence: &transition_code_evidence
      status: confirmed_from_code
      refs:
        - source_ref: af3_pairformer_code
          role: implementation_evidence
          locator: TransitionBlock.__call__ and PairFormerIteration.__call__
  - id: single_update_stage
    parent_ref: modules.pairformer_stack
    decomposition:
      status: complete
    label: Single Track Update
    kind: refiner
    mechanisms: [pair_logit_projection, self_attention, transition]
    role: use the updated pair state to bias token self-attention, then apply a token-wise transition
    scale: token
    evidence: *pair_code_evidence
  - id: single_pair_logits_projection
    parent_ref: modules.single_update_stage
    decomposition:
      status: leaf
    label: Project Pair Attention Bias
    kind: adapter
    mechanisms: [layer_normalization, linear_projection]
    role: normalize the updated pair state and project each token pair to 16 single-attention head logits
    scale: token_pair
    evidence: *pair_code_evidence
  - id: single_attention_with_pair_bias
    parent_ref: modules.single_update_stage
    decomposition:
      status: leaf
    label: Single Attention with Pair Bias
    kind: attention
    mechanisms: [full_attention, pair_logit_bias, query_gating, residual_update]
    role: update each token state with 16-head self-attention whose logits receive the projected pair bias
    scale: token
    attention:
      pattern: full
      query_scale: token
      key_value_scale: token
      heads: 16
      pair_bias: true
      pair_bias_source: updated_pair_state
      positional_encoding:
        kind: none
    evidence:
      status: confirmed_from_code
      refs:
        - source_ref: af3_pairformer_code
          role: callsite_evidence
          locator: PairFormerIteration single_attention_ call
        - source_ref: af3_self_attention_code
          role: implementation_evidence
          locator: self_attention
  - id: single_transition
    parent_ref: modules.single_update_stage
    decomposition:
      status: leaf
    label: Single Transition
    kind: feed_forward
    mechanisms: [layer_normalization, swiglu, residual_update]
    role: apply a pointwise 4x SwiGLU transition and add its 384-channel projection back to each token state
    scale: token
    evidence: *transition_code_evidence
  - id: input_feature_embedder
    parent_ref: architecture
    decomposition:
      status: complete
    label: Input Feature Embedder
    kind: encoder
    mechanisms: [atom_attention_encoding, per_token_feature_concatenation]
    role: build s_inputs by mean-pooling a bare-mode AtomAttentionEncoder pass over each token's isolated reference-conformer geometry, then concatenating that per-token vector with restype, profile, and deletion_mean
    scale: token
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 2 (InputFeatureEmbedder)
  - id: atom_attention_encoder_bare
    parent_ref: modules.input_feature_embedder
    decomposition:
      status: opaque
      reason: AtomAttentionEncoder (Algorithm 5) is the same reusable routine called a second time, in conditioned mode with real trunk single/pair and noisy-position arguments, inside the Diffusion Module. Modeling its internals here, against only this bare-mode call, would either duplicate that modeling effort or model only half the routine's real requirements; its internals become a reusable standard_block the first time a module actually needs them modeled, likely the Diffusion Module pass.
    label: Atom Attention Encoder (bare mode)
    kind: encoder
    mechanisms: [sequence_local_atom_attention, per_atom_to_per_token_mean_pooling]
    role: encode each token's isolated reference-conformer geometry and identity into one per-token vector via local self-attention over that token's own atoms, with no trunk single/pair or noisy-position conditioning
    scale: atom
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 5 (AtomAttentionEncoder), called from Supplementary Algorithm 2 line 1 with {r_l}, {s_trunk}, {z_ij} all None
  - id: input_feature_concatenation
    parent_ref: modules.input_feature_embedder
    decomposition:
      status: leaf
    label: Input Feature Concatenation
    kind: operator
    mechanisms: [feature_concatenation]
    role: concatenate the pooled per-token atom encoding with restype, profile, and deletion_mean to produce s_inputs
    scale: token
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 2 line 2 (concat(a_i, f_i^restype, f_i^profile, f_i^deletion_mean))
  - id: single_state_input_projection
    parent_ref: modules.trunk_model
    decomposition:
      status: leaf
    label: Project Single State Input
    kind: adapter
    mechanisms: [linear_projection]
    role: project s_inputs to the fixed 384-channel single_init anchor via one LinearNoBias layer
    scale: token
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 1 line 2 (s_init = LinearNoBias(s_inputs))
  - id: single_recycle_projection
    parent_ref: modules.trunk_model
    decomposition: { status: leaf }
    label: Project Previous Single State
    kind: adapter
    mechanisms: [layer_normalization, linear_projection]
    role: normalize and project the previous pass's single state before adding it to the fixed single_init anchor; the previous state is zero on the first pass
    scale: token
    evidence:
      status: confirmed_from_code
      refs:
        - { source_ref: af3_evoformer_code, role: implementation_evidence, locator: "evoformer.py Evoformer.__call__ (prev_single_embedding_layer_norm and prev_single_embedding added to fresh single_activations)" }
  - id: pair_recycle_projection
    parent_ref: modules.trunk_model
    decomposition: { status: leaf }
    label: Project Previous Pair State
    kind: adapter
    mechanisms: [layer_normalization, linear_projection]
    role: normalize and project the previous pass's pair state before adding it to the fixed z_init anchor; the previous state is zero on the first pass
    scale: token_pair
    evidence:
      status: confirmed_from_code
      refs:
        - { source_ref: af3_evoformer_code, role: implementation_evidence, locator: "evoformer.py Evoformer.__call__ (prev_embedding_layer_norm and prev_embedding added to fresh pair_activations)" }
  - id: pair_state_input_projection
    parent_ref: modules.trunk_model
    decomposition:
      status: leaf
    label: Project Pair State Input
    kind: adapter
    mechanisms: [linear_projection, outer_sum]
    role: project s_inputs to 128 channels via two independent LinearNoBias layers, one per token of the pair, and outer-sum them into the fixed z_init anchor
    scale: token_pair
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 1 line 3 (z_init_ij = LinearNoBias(s_i^inputs) + LinearNoBias(s_j^inputs); lines 4-5's RelativePositionEncoding and token_bonds contributions to z_init are separate inputs not modeled by this module)
  - id: relative_position_encoding
    parent_ref: architecture
    decomposition:
      status: partial
      reason: Real internal structure (the four conditionally-defined bucketed/boolean signals -- residue offset, token offset, same-entity, and chain offset -- and the same-chain/same-residue gates each depends on) is modeled at value-site granularity rather than as further child modules, matching the depth already given to modules.outer_product_mean.
    label: Relative Position Encoding
    kind: operator
    mechanisms: [offset_clipping, one_hot_encoding, conditional_masking, concatenation, linear_projection]
    role: from five raw per-token identifiers (asym_id, entity_id, residue_index, sym_id, token_index), build four conditionally-defined relative-position signals per token pair -- a residue-index offset one-hot bucketed and clipped to r_max=32, valid only within the same chain; a finer token-index offset at the same clipping, valid only within the same chain and same residue (needed because a modified residue or ligand is tokenized per-atom, so several tokens can share one residue_index); a raw same-entity boolean, left unbucketed since there is no distance to discretize; and a chain-copy-number offset one-hot bucketed and clipped to s_max=2, valid only across different chains -- then concatenate all four and linearly project them once into a 128-channel (c_z) additive pair bias. AF3 uses this one-hot-bucket-and-project approach instead of rotary positional encodings because tokens carry several simultaneous, discontinuous notions of relative position (offset within a chain, offset within a residue, which chain/entity) that a single smooth rotation cannot represent
    scale: token_pair
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 3 (RelativePositionEncoding); Section 3.1.2 (r_max=32, s_max=2) -- this exact algorithm is invoked twice in AF3, seeding z_init (Algorithm 1 line 4) and again inside DiffusionConditioning (Algorithm 21 line 1); only this one shared module is modeled here, feeding value_sites.relative_position_encoding_output
  - id: msa_module
    parent_ref: modules.trunk_model
    decomposition:
      status: complete
    label: MSA Module
    kind: refiner
    mechanisms: [msa_row_embedding, outer_product_mean, msa_pair_weighted_averaging, transition, triangle_multiplication, axial_pair_attention]
    role: embed raw per-row MSA features (one-hot sequence identity, deletion flags/values) plus s_inputs into per-row MSA activations, then read those activations into OuterProductMean to contribute evolutionary coupling into the pair representation; update the MSA activations via MSAPairWeightedAveraging (attention whose weights come entirely from the pair representation) followed by a Transition; and run the resulting pair state through the module's own pair-stack (triangle multiplication x2, triangle attention x2, transition), architecturally identical to the Pairformer's own pair-stack mechanism but with its own parameters, run N_block=4 times instead of 48; only z_ij is returned, the MSA representation itself is discarded every call; this module board shows one representative call while execution.loops.trunk_recycling accounts for repeated calls
    scale: msa
    repeats: 4
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 8 (MsaModule), lines 1-15
  - id: msa_row_embedding
    parent_ref: modules.msa_module
    decomposition:
      status: leaf
    label: MSA Row Embedding
    kind: adapter
    mechanisms: [feature_concatenation, linear_projection, additive_conditioning]
    role: concatenate each MSA row's raw one-hot identity, deletion flag, and deletion value features and linearly embed them to c_m=64 via one LinearNoBias layer, then add s_inputs (via a separate LinearNoBias layer) into every row identically
    scale: msa
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 8 lines 1, 3-4
  - id: outer_product_mean
    parent_ref: modules.msa_module
    decomposition:
      status: partial
      reason: Real internal structure (the two independent a_si/b_si projections, the mean outer product, and the biased pair-channel compression) is modeled at value-site granularity rather than as further child modules; see the outer_product_mean_detail board.
    label: Outer Product Mean
    kind: operator
    mechanisms: [layer_normalization, linear_projection, outer_product, mean_pooling, biased_linear_projection]
    role: normalize the MSA activations, project them into two independent c=32 factors, form the outer product of the two factors for every token pair, average that outer product over all MSA rows and flatten it to a 1024-channel vector, then compress it with one bias-carrying Linear layer (the one exception to LinearNoBias in this mechanism) into a 128-channel contribution to the pair representation; the only place in the model where evolutionary coupling across the MSA enters the pair representation
    scale: token_pair
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 9 (OuterProductMean); called from Algorithm 8 line 6
  - id: msa_pair_weighted_averaging
    parent_ref: modules.msa_module
    decomposition:
      status: partial
      reason: Real internal structure (the pair-derived per-head weights, the per-row value and gate projections, and the output projection) is modeled at value-site granularity rather than as further child modules; see the msa_pair_weighted_averaging_detail board.
    label: MSA Pair Weighted Averaging
    kind: attention
