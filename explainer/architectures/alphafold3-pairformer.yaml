    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 23 line 3 and Algorithm 25, whose expansion factor n=2 over a 768-channel activation gives the 1536-channel hidden width bound here
        - source_ref: af3_self_attention_code
          role: implementation_evidence
          locator: diffusion_transformer.py transition_block with single_cond supplied and num_intermediate_factor=2
  - id: atom_encoder_attention_pair_bias
    block_ref: standard_blocks/attention-pair-bias.yaml
    subject_ref: modules.atom_encoder_atom_transformer
    variant: adaln_conditioned
    use_scope: internal_mechanism
    conformance: wrapped
    difference_summary: The same conditioned attention block as the token level, with three differences owned by the AtomTransformer wrapper around it. The additive mask slot that stays empty at token level carries the sequence-local block-diagonal mask here, which is what restricts each atom to a 128-atom neighbourhood. The head count drops from 16 to 4 and the surrounding block loop from 24 to 3. Conditioning is per atom (each atom's own c_l) rather than per token. The wrapper also owns the residual sum with the transition branch and the repetition itself; this instance covers one attention branch of one block.
    port_bindings:
      - port_ref: ports.single_state
        relation_refs: [relations.atom_query_enters_encoder_atom_transformer]
      - port_ref: ports.conditioning_signal
        relation_refs: [relations.atom_conditioning_drives_encoder_atom_transformer]
      - port_ref: ports.pair_context
        relation_refs: [relations.atom_pair_biases_encoder_atom_transformer]
      - port_ref: ports.mask_bias
        relation_refs: [relations.locality_mask_restricts_encoder_atom_transformer]
      - port_ref: ports.attention_output
        relation_refs: [relations.encoder_atom_transformer_produces_query]
    parameter_bindings:
      - { parameter_ref: parameters.h, configuration_ref: reference_configuration.atom_transformer_heads }
      - { parameter_ref: parameters.c, configuration_ref: reference_configuration.atom_transformer_head_width }
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 5 line 15 into Algorithm 7 (the locality mask in the beta slot) into Algorithm 23 line 2 into Algorithm 24; c_l is never None on this path, so the conditioned variant is always the one taken
        - source_ref: af3_atom_cross_attention_code
          role: implementation_evidence
          locator: atom_cross_attention.py atom_cross_att_encoder, which passes queries_single_cond as the conditioning and pair_act as the pair bias into CrossAttTransformer
  - id: atom_encoder_conditioned_transition
    block_ref: standard_blocks/conditioned-transition-block.yaml
    subject_ref: modules.atom_encoder_atom_transformer
    variant: adaln_conditioned_transition
    use_scope: internal_mechanism
    conformance: wrapped
    difference_summary: The same conditioned transition block as the token level, conditioned per atom rather than per token and expanded over a 128-channel activation instead of a 768-channel one. The AtomTransformer wrapper owns the three-block loop and the residual sum with the attention branch; this instance covers one transition branch of one block. The transition branch takes no pair input and no mask, so the locality restriction that shapes the attention branch does not touch it.
    port_bindings:
      - port_ref: ports.single_state
        relation_refs: [relations.atom_query_enters_encoder_atom_transformer]
      - port_ref: ports.conditioning_signal
        relation_refs: [relations.atom_conditioning_drives_encoder_atom_transformer]
      - port_ref: ports.transition_output
        relation_refs: [relations.encoder_atom_transformer_produces_query]
    parameter_bindings:
      - { parameter_ref: parameters.c_hidden, configuration_ref: reference_configuration.atom_transition_hidden_width }
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 5 line 15 into Algorithm 7 into Algorithm 23 line 3 into Algorithm 25, with the expansion factor n=2 over 128 channels giving the 256-channel hidden width bound here
        - source_ref: af3_atom_cross_attention_code
          role: implementation_evidence
          locator: atom_cross_attention.py AtomCrossAttEncoderConfig.atom_transformer (num_intermediate_factor=2) feeding diffusion_transformer.transition_block with the per-atom conditioning supplied
  - id: atom_decoder_attention_pair_bias
    block_ref: standard_blocks/attention-pair-bias.yaml
    subject_ref: modules.atom_decoder_atom_transformer
    variant: adaln_conditioned
    use_scope: internal_mechanism
    conformance: wrapped
    difference_summary: Shaped exactly like the encoder's atom-level instance (four heads, three blocks, the same sequence-local mask in the additive slot), but conditioned on the encoder's saved skip tensors rather than on anything this pass computes. The conditioning and pair inputs bound here are c_skip and p_skip, carried across the token bottleneck rather than rebuilt, which is what makes this a U-Net-style skip rather than a second encoder. Parameters are the decoder's own; the reuse is of the routine, not of the weights. The wrapper owns the three-block loop and the residual sum with the transition branch.
    port_bindings:
      - port_ref: ports.single_state
        relation_refs: [relations.atom_query_enters_decoder_atom_transformer]
      - port_ref: ports.conditioning_signal
