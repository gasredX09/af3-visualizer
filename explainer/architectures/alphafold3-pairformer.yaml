        relation_refs: [relations.token_block_activation_enters_transition_branch]
      - port_ref: ports.conditioning_signal
        relation_refs: [relations.conditioned_single_drives_token_transition_adaln]
      - port_ref: ports.transition_output
        relation_refs: [relations.token_transition_branch_produces_update]
