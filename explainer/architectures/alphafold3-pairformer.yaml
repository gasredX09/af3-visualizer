    scale: atom_pair
    semantic_role: the per-atom-pair tensor (p_lm) at the narrow atom-pair width c_atompair=16, built from reference-conformer geometry and, in conditioned mode, the trunk's already-conditioned pair tensor read at the two atoms' parent tokens; it supplies the attention bias for both atom-level passes
    shape: "N_atom x N_atom x 16"
    glyph: pair
    carries:
      - reference-conformer offsets and inverse-square-distance proximity between atom pairs, zeroed across separately generated conformers
      - the parent token pair's entry in the conditioned pair tensor
      - the two atoms' own conditioning vectors, folded in as an outer sum
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 5 lines 2-6 (reference offsets, same-instance validity mask, inverse-square distances), line 10 (p_lm += LinearNoBias(LayerNorm(z_tok_idx(l) tok_idx(m)))), lines 13-14 (outer sum of the two atoms' conditioning, then a 3-layer ReLU MLP); Algorithm 20 signature (c_atompair=16)
  - id: sequence_local_attention_mask
    scale: atom_pair
    semantic_role: the additive sequence-local mask (beta_lm) that restricts atom attention to rectangular blocks along the diagonal, 0 on allowed atom pairs and -10^10 elsewhere; it is an additive logit term, not a separate masking mechanism, occupying the same slot the pair bias writes into
    shape: "N_atom x N_atom"
    glyph: pair
    carries:
      - per-atom-pair additive logit offset that is either zero or effectively negative infinity
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: "Supplementary Algorithm 7 line 1 (beta_lm = 0 if |l - c| < N_queries/2 and |m - c| < N_keys/2 for some subset centre c, else -10^10), with N_queries=32, N_keys=128 and subset centres at 15.5, 47.5, 79.5 and so on; Algorithm 24 line 8, where beta enters the same additive term as the pair projection"
        - source_ref: af3_atom_cross_attention_code
          role: implementation_evidence
          locator: "atom_cross_attention.py, where the released implementation realizes the same restriction as an explicit queries/keys gather layout (batch.atom_cross_att.queries_to_keys) feeding CrossAttTransformer, rather than materializing a full N_atom x N_atom bias tensor"
  - id: diffusion_token_activation
    scale: token
    semantic_role: the per-token activation (a_i) inside the diffusion module at the token channel width c_token=768; produced by mean-pooling the atom encoder's output, refined by the token-level transformer, and read back down by the atom decoder. It is a per-denoising-step activation, distinct from the trunk's own single_state and from the diffusion conditioning tensors
    shape: "N_token x 768"
    glyph: single
    carries:
      - per-token summary of the current noisy structure at atom resolution
      - the fully conditioned single vector, injected once as a residual at the token bottleneck's entrance
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 5 line 16 (a_i = mean over the token's atoms of relu(LinearNoBias(q_l)), a_i in R^c_token); Algorithm 20 lines 3-6 and signature (c_token=768), which is a wider c_token than the bare-mode call in Algorithm 2 line 1 (c_token=384)
  - id: atom_position_update
    scale: atom
    semantic_role: the atom decoder's returned per-atom position update (r_l^update), in the same dimensionless space as the scaled noisy positions rather than in angstroms; the diffusion module rescales and blends it with the noisy input to produce coordinates
    shape: "N_atom x 3"
    glyph: coordinates
    carries:
      - per-atom 3D correction proposed by this denoising step
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 6 line 3 (r_l^update = LinearNoBias(LayerNorm(q_l))); Algorithm 20 line 8, where it is rescaled by sigma_data * t_hat / sqrt(sigma_data^2 + t_hat^2) and blended with the noisy input
  - id: denoised_atom_positions
    scale: atom
    semantic_role: the diffusion module's own returned per-atom coordinates for this denoising step, back in the same real-valued angstrom space as the raw noisy input rather than the dimensionless space the network operates in internally; a noise-level-weighted posterior-mean blend of the raw noisy input and the rescaled position update, not a clean structure prediction on its own
    shape: "N_atom x 3"
    glyph: coordinates
    carries:
      - per-atom 3D denoised position estimate for the current noise level
    evidence:
      status: confirmed_from_paper
      refs:
        - source_ref: af3_2024
          role: paper_evidence
          locator: Supplementary Algorithm 20 line 8 (x_l^out = sigma_data^2/(sigma_data^2+t_hat^2) * x_l^noisy + sigma_data*t_hat/sqrt(sigma_data^2+t_hat^2) * r_l^update) and line 9 (return {x_l^out}); consumed as {x_l^denoised} by Algorithm 18 line 8, the sampler's call site

  - id: sampler_coordinate_state
    scale: atom
    semantic_role: atom coordinates carried between sampler steps, initialized as Gaussian noise and rigidly augmented before each denoiser call
    shape: "N_atom x 3"
    glyph: coordinates
    carries: [current per-atom sampling coordinates]
    evidence:
      status: confirmed_from_code
      refs:
        - { source_ref: af3_sampler_code, role: implementation_evidence, locator: "diffusion_head.py:333-378 (initial positions, step carry, random augmentation)" }
  - id: sampler_direction
    scale: atom
    semantic_role: per-atom difference between noisy coordinates and denoiser estimate divided by t_hat, before the signed schedule step is applied
    shape: "N_atom x 3"
    glyph: coordinates
    carries: [denoising direction used by the fixed sampler update]
    evidence:
      status: confirmed_from_code
      refs:
        - { source_ref: af3_sampler_code, role: implementation_evidence, locator: "diffusion_head.py:349-352 (grad = (positions_noisy - positions_denoised) / t_hat)" }
  - id: sampler_updated_positions
    scale: atom
    semantic_role: one sampler iteration's updated atom coordinates after using the denoiser estimate, distinct from the estimate itself
    shape: "N_atom x 3"
    glyph: coordinates
    carries: [updated coordinates for the next sampling iteration]
    evidence: &sampler_update_evidence
      status: confirmed_from_code
      refs:
        - { source_ref: af3_sampler_code, role: implementation_evidence, locator: "diffusion_head.py:333-354 (positions_denoised enters grad, then positions_out is updated from positions_noisy)" }
  - id: final_sampled_atom_positions
    scale: atom
    semantic_role: one completed diffusion sample after all sampler updates, supplied to the confidence head
    shape: "N_atom x 3"
    glyph: coordinates
    carries: [predicted atom coordinates of one completed sample]
    evidence: &final_sample_evidence
      status: confirmed_from_code
      refs:
        - { source_ref: af3_sampler_code, role: implementation_evidence, locator: "diffusion_head.py:373-378 (scan output positions_out returned as atom_positions)" }
        - { source_ref: af3_model_code, role: implementation_evidence, locator: "model.py:321-339 (samples['atom_positions'] mapped through ConfidenceHead per sample)" }
  - id: confidence_representative_distances
    scale: token_pair
    semantic_role: distance between representative atoms of token i and token j in the predicted sample, before one-hot binning
    shape: "N_token x N_token"
    glyph: pair
    carries: [predicted-structure pair distances in angstroms]
    evidence: &confidence_distance_evidence
      status: confirmed_from_paper
      refs:
        - { source_ref: af3_2024, role: paper_evidence, locator: "Supplementary Algorithm 31 lines 2-3 (representative-atom distance d_ij and binned injection into pair state)" }
        - { source_ref: af3_confidence_head_code, role: implementation_evidence, locator: "confidence_head.py:82-98 (_embed_features converts sampled positions to token representative atoms and builds dgram)" }
  - id: confidence_pair_state
    scale: token_pair
    semantic_role: the confidence head's own 128-channel pair state, seeded from the trunk pair state and augmented with input and sampled-geometry features
    shape: "N_token x N_token x 128"
    glyph: pair
    carries: [trunk pair context augmented for judging this sampled structure]
    evidence: &confidence_pair_evidence
      status: confirmed_from_paper
      refs:
        - { source_ref: af3_2024, role: paper_evidence, locator: "Supplementary Algorithm 31 lines 1-6 (pair augmentation, four-block refinement, PAE and PDE projections)" }
        - { source_ref: af3_confidence_head_code, role: implementation_evidence, locator: "confidence_head.py:125-164 (pair_act augmentation and four PairFormerIteration blocks)" }
  - id: confidence_single_state
    scale: token
    semantic_role: the confidence head's own 384-channel single state after four full Pairformer blocks
    shape: "N_token x 384"
    glyph: single
    carries: [refined token context for atom-wise confidence projections]
    evidence: &confidence_single_evidence
      status: confirmed_from_paper
      refs:
        - { source_ref: af3_2024, role: paper_evidence, locator: "Supplementary Algorithm 31 lines 4, 7-8 (refined single state feeds pLDDT and resolved projections)" }
        - { source_ref: af3_confidence_head_code, role: implementation_evidence, locator: "confidence_head.py:142-162,247-271 (full Pairformer then atom-channel projections)" }
  - id: predicted_lddt_distribution
    scale: atom
    semantic_role: 50-bin learned distribution over each atom's local distance difference score
    shape: "N_atom x 50"
    glyph: matrix
    carries: [probability per predicted local score bin]
    evidence: &plddt_evidence
      status: confirmed_from_code
      refs:
        - { source_ref: af3_confidence_head_code, role: implementation_evidence, locator: "confidence_head.py:247-259 (50-bin plddt_logits, softmax, expected value scaled to 100)" }
  - id: predicted_lddt
    scale: atom
    semantic_role: per-atom predicted local distance difference score, an expectation over learned bins rather than measured agreement
    shape: "N_atom"
    glyph: vector
    carries: [predicted local score from 0 to 100]
    evidence: *plddt_evidence
  - id: predicted_aligned_error_distribution
    scale: token_pair
    semantic_role: directional 64-bin learned distribution for token j's alignment error in token i's reference frame
    shape: "N_token x N_token x 64"
    glyph: pair
    carries: [directional predicted aligned-error bin probabilities]
    evidence: &pae_evidence
      status: confirmed_from_code
      refs:
        - { source_ref: af3_2024, role: paper_evidence, locator: "Supplementary Algorithm 30 and Algorithm 31 line 5 (frame-anchored directional PAE)" }
        - { source_ref: af3_confidence_head_code, role: implementation_evidence, locator: "confidence_head.py:203-228 (64-bin pae_logits, softmax, expected error)" }
  - id: predicted_aligned_error
    scale: token_pair
    semantic_role: directional expected PAE in angstroms, with row token i as frame anchor and column token j as evaluated token
    shape: "N_token x N_token"
    glyph: pair
    carries: [predicted aligned error in angstroms]
    evidence: *pae_evidence
  - id: predicted_distance_error_distribution
    scale: token_pair
    semantic_role: symmetric 64-bin learned distribution over representative-atom distance error
    shape: "N_token x N_token x 64"
    glyph: pair
    carries: [symmetric predicted distance-error bin probabilities]
    evidence: &pde_evidence
      status: confirmed_from_code
      refs:
        - { source_ref: af3_2024, role: paper_evidence, locator: "Supplementary Algorithm 31 line 6 (PDE uses symmetrized pair state)" }
        - { source_ref: af3_confidence_head_code, role: implementation_evidence, locator: "confidence_head.py:169-200 (distance logits symmetrized before softmax and expectation)" }
  - id: predicted_distance_error
    scale: token_pair
    semantic_role: symmetric expected PDE in angstroms for the representative-atom distance between token i and token j
    shape: "N_token x N_token"
    glyph: pair
    carries: [predicted distance error in angstroms]
    evidence: *pde_evidence
  - id: predicted_resolved_distribution
    scale: atom
    semantic_role: two-class learned distribution over whether each atom would be experimentally resolved
    shape: "N_atom x 2"
    glyph: matrix
    carries: [resolved and unresolved class probabilities]
    evidence: &resolved_evidence
      status: confirmed_from_code
      refs:
        - { source_ref: af3_2024, role: paper_evidence, locator: "Supplementary Section 4.3.4 and Algorithm 31 line 8 (two-class resolved prediction)" }
        - { source_ref: af3_confidence_head_code, role: implementation_evidence, locator: "confidence_head.py:261-271 (two-logit per-atom projection and positive-class probability)" }
  - id: predicted_experimentally_resolved
    scale: atom
    semantic_role: predicted probability that each atom would be observed in experimental structure data
    shape: "N_atom"
    glyph: vector
    carries: [predicted probability of experimental resolution]
    evidence: *resolved_evidence

