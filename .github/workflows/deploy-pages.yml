name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint explainer sources
        run: ruby explainer/scripts/lint_sources.rb
      - name: Verify every explainer source set
        run: |
          for set in $(ruby -ryaml -e 'puts YAML.load_file("architectures/index.yaml").fetch("source_sets").map { |s| s.fetch("id") }'); do
            ruby scripts/verify_architecture.rb --source-set "$set"
          done
        working-directory: explainer
      # lib/architecture_review.rb requires webrick, which Ruby has not bundled since 3.0.
      - name: Install webrick for the review tests
        run: gem install webrick --version 1.9.2 --no-document
      - name: Run explainer Ruby tests (includes the published entry-point test)
        run: ruby -Ilib:test -e 'Dir["test/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
        working-directory: explainer
      - name: Run explainer JS tests
        run: node --test test/*.mjs
        working-directory: explainer
      - name: Run trace tests
        run: node --test trace/model.test.mjs
      - name: Build architecture explainer (site root)
        run: ruby explainer/scripts/build_pages.rb --source-set alphafold3 --output dist
      - name: Build legacy screens (dist/screens/)
        run: node scripts/build-pages.mjs
      - name: Build synthetic AF3 trace (dist/trace/)
        run: node scripts/build-trace.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
