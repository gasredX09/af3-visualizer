name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint explainer sources
        run: ruby explainer/scripts/lint_sources.rb
      - name: Verify published entry points
        run: ruby -Ilib:test test/pages_build_test.rb
        working-directory: explainer
      - name: Build architecture explainer (site root)
        run: ruby explainer/scripts/build_pages.rb --source-set alphafold3 --output dist
      - name: Build legacy screens (dist/screens/)
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
